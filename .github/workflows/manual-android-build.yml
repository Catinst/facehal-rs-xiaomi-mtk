name: Manual Android production build

on:
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: Enable verbose logging in the compiled HAL and helpers
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: '27.2.12479018'
      FACEHAL_MIN_SDK: '31'
      FACEHAL_VERBOSE_LOGS: ${{ inputs.verbose_logs && '1' || '0' }}
      FACEHAL_BUILD_JOBS: '2'
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out production sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install host compiler and libclang 18
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ libclang-18-dev

      - name: Install Rust and the Android target
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable

      - name: Install official Android NDK r27c
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:?GitHub Ubuntu runner must provide the Android SDK}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" "ndk;$NDK_VERSION"
          printf 'ANDROID_NDK_HOME=%s/ndk/%s\n' "$sdk_root" "$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Check CI utilities and host core actor preview tests
        run: |
          python3 -B -m unittest discover -s ci -p 'test_*.py' -v
          sh scripts/test-compat.sh

      - name: Prepare link-only symbols and build production binaries
        run: bash ci/build.sh

      - name: Upload source-built executables and text templates only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: facehal-source-build-${{ github.sha }}
          path: out/ci-artifact/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
